<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dziękuję</title>
  <style>
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f5f2;color:#1f1f1f;display:grid;place-items:center;min-height:100vh}
    .box{max-width:680px;margin:24px;background:#fff;border:1px solid #dfddd7;border-radius:22px;padding:42px;box-shadow:0 20px 60px rgba(0,0,0,.07);text-align:center}
    h1{font-size:2.2rem;margin:0 0 12px}
    p{color:#6d6a64;line-height:1.6}
  </style>
</head>
<body>
  <main class="box">
    <h1>Dziękuję za wypełnienie ankiety.</h1>
    <p>Wasze odpowiedzi zostały zapisane i będą podstawą do dalszej pracy nad projektem.</p>
  </main>
</body>
</html>
